# Cyrus IMAP configuration for the php-imap server matrix (tests/servers/docker-compose.yml).
# Debian's default imapd.conf, reduced to IMAP, plus TLS (snakeoil cert) and an sasldb-backed test account.
# Traditional namespace: "." as hierarchy separator, personal folders below INBOX (altnamespace: no).
configdirectory: /var/lib/cyrus
proc_path: /run/cyrus/proc
mboxname_lockpath: /run/cyrus/lock
defaultpartition: default
partition-default: /var/spool/cyrus/mail
servername: cyrus
admins: cyrus
altnamespace: no
unixhierarchysep: no
allowanonymouslogin: no
allowplaintext: yes
autocreate_quota: 0
umask: 077
hashimapspool: true
sasl_pwcheck_method: auxprop
sasl_auxprop_plugin: sasldb
sasl_mech_list: PLAIN LOGIN
sasl_auto_transition: no
tls_server_cert: /etc/ssl/certs/ssl-cert-snakeoil.pem
tls_server_key: /etc/ssl/private/ssl-cert-snakeoil.key
tls_client_ca_dir: /etc/ssl/certs
lmtpsocket: /run/cyrus/socket/lmtp
idlesocket: /run/cyrus/socket/idle
notifysocket: /run/cyrus/socket/notify
syslog_prefix: cyrus
