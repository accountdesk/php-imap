# Cyrus master configuration for the php-imap server matrix: IMAP (143) and IMAPS (993) only.
START {
	recover		cmd="/usr/sbin/cyrus ctl_cyrusdb -r"
}
SERVICES {
	imap		cmd="imapd -U 30" listen="143" prefork=1 maxchild=200
	imaps		cmd="imapd -s -U 30" listen="993" prefork=1 maxchild=200
	lmtpunix	cmd="lmtpd" listen="/run/cyrus/socket/lmtp" prefork=0 maxchild=20
}
DAEMON {
	idled		cmd="idled"
}
EVENTS {
	checkpoint	cmd="/usr/sbin/cyrus ctl_cyrusdb -c" period=30
}
