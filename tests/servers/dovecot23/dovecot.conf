# Dovecot 2.3 test server for the php-imap server matrix (tests/servers/docker-compose.yml).
# Replaces the image's /etc/dovecot/dovecot.conf. One fixed account (see users), maildir-free sdbox storage,
# "/" as hierarchy separator, IMAP on 143 (cleartext login allowed) and 993 (self-signed cert from the image).

mail_home = /srv/mail/%Lu
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

protocols = imap

disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000
}

ssl = yes
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}

mail_plugins = $mail_plugins quota
protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
plugin {
  quota = count:User quota
  quota_rule = *:storage=1G
  quota_vsizes = yes
}

service imap-login {
  process_min_avail = 1
  client_limit = 1000
  service_count = 0
}

listen = *
log_path = /dev/stdout
info_log_path = /dev/stdout
