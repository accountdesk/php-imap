# Dovecot 2.4 test server for the php-imap server matrix (tests/servers/docker-compose.yml).
# Replaces the image's /etc/dovecot/dovecot.conf (2.4 syntax differs from 2.3). The image runs rootless,
# so IMAP listens on 31143 and IMAPS on 31993 (self-signed cert from the image). One fixed account (see users).
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

base_dir = /run/dovecot
state_dir = /run/dovecot

protocols = imap

mail_driver = maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_path = ~/mail
mail_home = /srv/vmail/%{user | lower}
mail_uid = vmail
mail_gid = vmail

auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
  }
}

log_path = /dev/stdout

mail_plugins {
  quota = yes
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
quota "User quota" {
  driver = count
  storage_size = 1G
}

service imap-login {
  process_min_avail = 1
  client_limit = 100
}

!include_try vendor.d/*.conf
!include_try conf.d/ssl.conf
!include_try conf.d/mail.conf
